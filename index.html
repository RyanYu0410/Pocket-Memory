<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Pocket Memory — an interactive archive of objects carried in a coat." />
  <title>Pocket Memory</title>
  <link rel="preload" as="image" href="assets/jacket.webp?v=4" />
  <link rel="preload" as="image" href="assets/objects-sprite.webp?v=4" />
  <link rel="stylesheet" href="style2.css?v=4" />
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Pocket Memory</h1>
        <p>Fragments carried in pockets.</p>
      </div>
      <nav aria-label="controls">
        <button id="startPerformance">play</button>
        <button id="resetAll">clear</button>
        <button id="soundToggle" aria-pressed="true">sound</button>
      </nav>
    </header>

    <section class="coat-stage" aria-label="photographic black coat">
      <div class="coat-object">
        <img src="assets/jacket.webp?v=4" alt="Black puffer coat with many pockets" width="660" height="800" decoding="async" fetchpriority="high" />
        <button class="pocket p1" data-pocket="0" aria-label="open upper pocket"></button>
        <button class="pocket p2" data-pocket="1" aria-label="open chest pocket"></button>
        <button class="pocket p3" data-pocket="2" aria-label="open lower left pocket"></button>
        <button class="pocket p4" data-pocket="3" aria-label="open lower right pocket"></button>
        <button class="pocket p5" data-pocket="4" aria-label="open bottom pocket"></button>
        <button class="pocket p6" data-pocket="5" aria-label="open sleeve pocket"></button>
      </div>
      <p class="hint">touch a pocket</p>
    </section>

    <section class="archive">
      <div class="archive-head">
        <span id="progressText">0 / 18</span>
        <span id="memoryTitle">closed</span>
      </div>
      <div id="memoryTable" class="memory-table" aria-live="polite">
        <p id="tablePlaceholder">Objects will gather here.</p>
      </div>
      <p id="memoryDescription" class="description">Rearrange them as you remember.</p>
    </section>
  </main>

  <template id="memoryTemplate">
    <article class="memory-piece">
      <div class="cutout" aria-hidden="true"></div>
      <span class="label"></span>
      <span class="note"></span>
    </article>
  </template>

  <script src="script2.js?v=4"></script>
</body>
</html>
